# Redis configuration for development
# Reference: https://redis.io/docs/manual/config/

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence — lightweight for dev (RDB snapshot)

save 900 1
save 300 10
save 60 10000

# Memory management

maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
